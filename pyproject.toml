[ build-system ]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memvault"]


[ project ]
name = "eviloomemvault"
version = "0.2.0"
description = "Open Source memory infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    {name = "Aryan"}
]
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "structlog>=24.0",
    "typer>=0.9",
    "rich>=13.0",
    "mcp>=1.0",
    "fastmcp>=2.0",
]

[ project.optional-dependencies ]

local = [
    "sentence-transformers>=3.0",
]

postgres = [
    "psycopg2-binary>=2.9",
]

dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[ tool.ruff ]
line-length = 100
target-version = "py310"

[ tool.ruff.lint ]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[ tool.pytest.ini_options ]
testpaths = ["tests", "benchmarks"]

[ tool.mypy ]
python_version = "3.10"
ignore_missing_imports = true

[ project.scripts ]
memvault = "memvault.cli.main:main"
memvault-mcp = "memvault.mcp_server.server:main"